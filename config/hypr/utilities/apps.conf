windowrule = match:tag floating-window, float true
windowrule = match:tag floating-window, center on
windowrule = match:tag floating-window, size 800 600
windowrule = match:tag floating-window, rounding 10

windowrule = match:class my-window, border_size 10

# Float proton vpn
windowrule = match:class protonvpn-app, tag +floating-window

# Float gapless music player
windowrule = match:class com.github.neithern.g4music, tag +floating-window

# Float mpv
windowrule = match:class mpv, tag +floating-window

# Float Nautilus sushi previewer
windowrule = match:class org.gnome.NautilusPreviewer, tag +floating-window

# Float qbittorrent
windowrule = match:class org.qbittorrent.qBittorrent, tag floating-window

# Float imv image viewer
windowrule = match:class imv, tag +floating-window

# Float gnome boxes
windowrule = match:class org.gnome.Boxes, tag +floating-window

# Wifi menu in TUI
windowrule = match:class Wifitui, float true
windowrule = match:class Wifitui, center on
windowrule = match:class Wifitui, size 700 550
windowrule = match:class Wifitui, stay_focused on

# Float ticktick
windowrule = match:class ticktick, float true
windowrule = match:class ticktick, center on
windowrule = match:class ticktick, size 680 650

# Float gnome clocks
windowrule = match:class org.gnome.clocks, tag +floating-window

# Float telegram
windowrule = match:class org.telegram.desktop, tag +floating-window

# Localsend
windowrule = match:class localsend, float true
windowrule = match:class localsend, size 200 90

# Waybar
layerrule = blur on, match:namespace waybar
# layerrule = ignore_zero on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

# Kitty
windowrule = match:class ^kitty$, opacity 0.9 0.9
# optional: keep full opacity in fullscreen
windowrule = match:class ^kitty$, opacity 0.9 0.9 1.0

# Float TUI.float class apps
windowrule = match:class TUI.float, tag +floating-window

# Browser types
windowrule = match:class ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable|helium), tag +chromium-based-browser
windowrule = match:class ([fF]irefox|zen|librewolf), tag +firefox-based-browser
# PiP Window Rules
windowrule = match:title Picture.?in.?[pP]icture, float true
windowrule = match:title Picture.?in.?[pP]icture, pin true
windowrule = match:title Picture.?in.?[pP]icture, size 500 308
windowrule = match:title Picture.?in.?[pP]icture, move 100%-w-40 100%-w-40

# Some video sites should never have opacity applied to them
windowrule = match:initial_title ((?i)(?:[a-z0-9-]+\.)*youtube\.com_/|app\.zoom\.us_/wc/home), opacity 1.0 1.0
