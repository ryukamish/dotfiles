input {
  kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1

# Change speed of keyboard repeat
    repeat_rate = 60
    repeat_delay = 300
    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
      natural_scroll = true
        scroll_factor = 0.4
    }
}

# Scroll through workspaces with touchapd
gesture = 3, horizontal, workspace

