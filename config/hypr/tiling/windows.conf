# Floating windows
source = ~/.config/hypr/utilities/apps.conf
source = ~/.config/hypr/utilities/webcam-overlay.conf

# Stay focused on TUI windows & wait for them to close
windowrule = match:title Bluetui, stay_focused true
windowrule = match:title Wiremix, stay_focused true

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty), scroll_touchpad 1.5

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on
