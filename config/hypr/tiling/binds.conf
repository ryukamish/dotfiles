# Media keybinds
source = ~/.config/hypr/utilities/multimedia.conf

# Varibables for programs
$terminal = kitty
# $fileManager = $terminal -e yazi
$fileManager = XDG_CURRENT_DESKTOP=KDE dolphin
$menu = ~/.local/bin/rofi-menu
$app_menu = rofi -show drun
$browser = ~/.local/bin/browser

$mainMod = SUPER # Sets "Windows" key as main modifier

# Start applications
bindd = $mainMod, RETURN, Terminal, exec, $terminal
bindd = $mainMod, Q, Close active window, killactive,
bindd = SUPER CTRL, Q, Kill a window with a running app, exec, hyprctl kill
bindd = $mainMod CTRL SHIFT, Q, Close all windows, exec, ~/.local/bin/hypr-close-all-windows
bindd = $mainMod, E, Launch file manager, exec, $fileManager
bindd = $mainMod, B, Launch default browser, exec, $browser
bindd = ALT, SPACE, Launch list of installed apps, exec, $app_menu
bindd = CTRL ALT, SPACE, Launch list of options, exec, $menu
bindd = $mainMod, P, Power menu, exec, ~/.local/bin/rofi-powermenu
bindd = $mainMod ALT, L, Lockscreen with hyprlock, exec, ~/.local/bin/hyprlock

bind = $mainMod, M, exit,
bind = $mainMod, X, togglefloating,
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER SHIFT, F, Full width, fullscreen, 1
bindd = SUPER SHIFT, X, Toggle window floating/tiling, togglefloating,

bindd = $mainMod, R, Restart waybar, exec, ~/.local/bin/restart-app waybar
bindd = $mainMod, N, Toggle nightlight, exec, ~/.local/bin/nightlight-toggle hyprland
bindd = $mainMod, I, Toggle Hypridle, exec, ~/.local/bin/toggle-idle
bindd = , Print, Take a screenshot of region, exec, ~/.local/bin/screenshot
bindd = CTRL, Print, Take a screenshot of window, exec, ~/.local/bin/screenshot window
bindd = SHIFT, Print, Take a screenshot of output, exec, ~/.local/bin/screenshot output
bindd = ALT, Print, Take a screenrecording, exec, ~/.local/bin/rofi-screenrecord
bindd = CTRL ALT, Print, Stop recording, exec, ~/.local/bin/screenrecord
bindd = $mainMod, PERIOD, Emoji picker, exec, rofimoji
bindd = $mainMod, V, Clipboard history, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindd = $mainMod CTRL, C, Color picker, exec, hyprpicker | wl-copy
bindd = $mainMod, T, Tmux sessionizer, exec, $terminal -e ~/.local/bin/tmux-sessionizer
bindd = $mainMod, W, Change wallpaper, exec, ~/.local/bin/hyprwall

bindd = $mainMod, S, Launch Spotify music player, exec, XDG_CURRENT_DESKTOP=KDE strawberry
bindd = $mainMod, O, Launch Obsidian, exec, obsidian

# Brightness and volume contorl
bindd = , XF86MonBrightnessUp, Increase brightness, exec, ~/.local/bin/brightness-control up
bindd = , XF86MonBrightnessDown, Decrease brightness, exec, ~/.local/bin/brightness-control down

bindd = , XF86AudioRaiseVolume, Increase volume, exec, ~/.local/bin/volume-control up
bindd = , XF86AudioLowerVolume, Decrease volume, exec, ~/.local/bin/volume-control down

# External monitor management
# Lid close → disable laptop screen
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1,disable"

# Lid open  → re-enable laptop screen
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1,highres,auto,1.25"

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle through applications on active workspace
bindd = $mainMod, TAB, Cycle to next window, cyclenext

# Resize active window
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
