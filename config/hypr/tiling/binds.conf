# Media keybinds
source = ~/.config/hypr/utilities/multimedia.conf

# Varibables for programs
$terminal = kitty
$fileManager = $terminal -e yazi
$menu = rofi-menu
$app_menu = rofi -show drun
$browser = browser

$mainMod = SUPER # Sets "Windows" key as main modifier

# Start applications
bindd = $mainMod, RETURN, Terminal, exec, $terminal
bindd = $mainMod, Q, Close active window, killactive,
bindd = $mainMod CTRL SHIFT, Q, Close all windows, exec, hypr-close-all-windows
bindd = $mainMod SHIFT, F, Launch file manager, exec, $fileManager
bindd = $mainMod SHIFT, B, Launch default browser, exec, $browser
bindd = ALT, SPACE, Launch list of installed apps, exec, $app_menu
bindd = CTRL ALT, SPACE, Launch list of options, exec, $menu
bindd = $mainMod, ESCAPE, Power menu, exec, rofi-powermenu
bindd = $mainMod, L, Lockscreen with hyprlock, exec, hyprlock

bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bindd = SUPER, F, Full screen, fullscreen, 0
bindd = SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER SHIFT, V, Toggle window floating/tiling, togglefloating,
bindd = SUPER CTRL, X, Kill a window with a running app, exec, hyprctl kill

bindd = $mainMod CTRL, R, Restart waybar, exec, restart-app waybar
bindd = $mainMod CTRL, N, Toggle nightlight, exec, nightlight-toggle
bindd = $mainMod CTRL, I, Toggle Hypridle, exec, toggle-idle
bindd = , Print, Take a screenshot of region, exec, screenshot
bindd = CTRL, Print, Take a screenshot of window, exec, screenshot window
bindd = SHIFT, Print, Take a screenshot of output, exec, screenshot output
bindd = ALT, Print, Take a screenrecording, exec, rofi-screenrecord
bindd = $mainMod, PERIOD, Emoji picker, exec, rofi -show emoji -emoji-mode copy -theme-str 'window {width: 36em;}'
bindd = $mainMod CTRL, V, Clipboard history, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bindd = $mainMod CTRL, C, Color picker, exec, hyprpicker | wl-copy
bindd = $mainMod CTRL, T, Tmux sessionizer, exec, $terminal -e tmux-sessionizer

bindd = $mainMod SHIFT, M, Launch Spotify music player, exec, spotify-launcher
bindd = $mainMod SHIFT, O, Launch Obsidian, exec, obsidian

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Cycle through applications on active workspace
bindd = ALT, TAB, Cycle to next window, cyclenext

# Resize active window
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
